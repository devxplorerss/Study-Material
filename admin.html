<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Material Admin</title><link rel="stylesheet" href="styles.css"></head>
<body><header><h1>🛠 Study Material Admin</h1></header><main>
<section class="hero"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg"></p></section>
<section id="dash" class="hidden">
<div class="grid">
<div class="card"><h3>🎥 Add Video</h3><input id="vtitle" placeholder="Video title"><input id="vdesc" placeholder="Description"><input id="vprice" type="number" placeholder="Price"><input id="videoFile" type="file" accept="video/mp4,video/webm,video/quicktime"><button onclick="uploadVideo()">Upload & Add Video</button><p id="uploadMsg"></p></div>
<div class="card"><h3>💳 Pending payments</h3><div id="payments"></div></div>
</div>
 <h2>Customer Access</h2>
<div id="customers" class="grid">
  Loading customers...
</div>
<h2>Current Videos</h2><div id="videos" class="grid"></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<script>
const sb=window.supabase.createClient(STUDY_MATERIAL_SUPABASE.url,STUDY_MATERIAL_SUPABASE.publishableKey);let user=null;
const $=id=>document.getElementById(id);
async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  const {data,error}=await sb.auth.signInWithPassword({email,password});

  if(error){
    document.getElementById("msg").textContent=error.message;
    return;
  }

  const {data:profile,error:profileError}=await sb
    .from("profiles")
    .select("role")
    .eq("id",data.user.id)
    .single();

  if(profileError || !profile || profile.role!=="admin"){
    document.getElementById("msg").textContent="Not an admin.";
    await sb.auth.signOut();
    return;
  }

  document.getElementById("dash").classList.remove("hidden");
  document.getElementById("msg").textContent="Admin logged in.";
  loadPayments();
  loadVideos();
  loadCustomers();
}
async function uploadVideo(){
 const f=$("videoFile").files[0]; if(!f){$("uploadMsg").textContent="Choose an MP4 first.";return;}
 const title=$("vtitle").value.trim();const price=Number($("vprice").value||0);const desc=$("vdesc").value.trim();if(!title){$("uploadMsg").textContent="Enter a title.";return;}
 const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,"_");const path=`${user.id}/${Date.now()}_${safe}`;
 $("uploadMsg").textContent="Uploading video...";
 const up=await sb.storage.from("Videos").upload(path,f,{contentType:f.type||"video/mp4",upsert:false});
 if(up.error){$("uploadMsg").textContent=up.error.message;return;}
 const ins=await sb.from("videos").insert({title,description:desc,price,storage_path:path}).select().single();
 if(ins.error){await sb.storage.from("Videos").remove([path]);$("uploadMsg").textContent=ins.error.message;return;}
 $("uploadMsg").textContent="Video uploaded and added.";loadVideos();
}
async function loadVideos(){const {data}=await sb.from("videos").select("*").order("created_at",{ascending:false});$("videos").innerHTML=(data||[]).map(v=>`<div class="card"><h3>${v.title}</h3><p>₹${v.price}</p><p>${v.storage_path||""}</p><button onclick="toggleVideo(${v.id},${v.active})">${v.active?"Hide":"Show"}</button></div>`).join("")}
 async function loadCustomers(){
  const {data,error}=await sb
    .from("profiles")
    .select("id,email,name,video_access");

  if(error){
    document.getElementById("customers").innerHTML =
      "Customers load nahi ho rahe.";
    return;
  }

  document.getElementById("customers").innerHTML =
    (data || []).map(u => `
      <div class="card">
        <h3>${esc(u.name || u.email || "Customer")}</h3>
        <p>${u.email || ""}</p>
        <p>
          Access:
          <b>${u.video_access ? "ACTIVE ✅" : "RESTRICTED ❌"}</b>
        </p>
        <button onclick="restrictCustomer('${u.id}', ${u.video_access})">
          ${u.video_access ? "Restrict" : "Give Access"}
        </button>
      </div>
    `).join("");
}

async function restrictCustomer(id,hasAccess){
  const {error}=await sb
    .from("profiles")
    .update({video_access: !hasAccess})
    .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  if(hasAccess){
    alert("Chal lawde, paise nikaal 😄💸");
  }else{
    alert("Access restored 😎");
  }

  loadCustomers();
}
async function toggleVideo(id,active){await sb.from("videos").update({active:!active}).eq("id",id);loadVideos();}
async function loadPayments(){const {data}=await sb.from("purchases").select("*").eq("status","pending").order("created_at",{ascending:false});$("payments").innerHTML=(data||[]).map(p=>`<div class="card"><p>₹${p.amount}</p><p>UTR: <b>${p.payment_ref}</b></p><p>User: ${p.user_id}</p><button onclick="decide(${p.id},'approved')">Approve ✅</button><button onclick="decide(${p.id},'rejected')">Reject ❌</button></div>`).join("")||"<p>No pending payments.</p>"}
async function decide(id,status){
  const {data: purchase,error: purchaseError} = await sb
    .from("purchases")
    .select("user_id")
    .eq("id",id)
    .single();

  if(purchaseError){
    alert(purchaseError.message);
    return;
  }

  const {error} = await sb
    .from("purchases")
    .update({status})
    .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  if(status === "approved"){
    const {error: accessError} = await sb
      .from("profiles")
      .update({video_access:true})
      .eq("id",purchase.user_id);

    if(accessError){
      alert(accessError.message);
      return;
    }
  }

  alert(
    status === "approved"
      ? "Payment approved. Customer ko permanent video access mil gaya ✅"
      : "Payment rejected ❌"
  );

  loadPayments();
  loadCustomers();
}
window.login=login;window.uploadVideo=uploadVideo;window.toggleVideo=toggleVideo;window.decide=decide;
</script></body></html>
